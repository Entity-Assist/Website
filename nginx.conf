server {
    listen 80;
    server_name entityassist.com www.entityassist.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /index.html {
        expires -1;
    }
    # Only Angular's content-hashed bundles receive immutable caching.
    location ~* "-[a-z0-9]{8,}\.(js|css)$" {
        try_files $uri =404;
        expires 1y;
    }
    location ~* \.(js|css|svg|png|ico|woff2?|json|txt|xml|java)$ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
